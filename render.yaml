services:
  - type: web
    name: montana-kush-community-foundation
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeployTrigger: commit
    domains:
      - www.montanakush.org
    routes:
      - type: rewrite
        source: /survey
        destination: https://mkcf-store-partner-questionnaire.woollytern1.chatgpt.site/survey
      - type: rewrite
        source: /survey/*
        destination: https://mkcf-store-partner-questionnaire.woollytern1.chatgpt.site/survey/*
    headers:
      - path: /survey
        name: Cache-Control
        value: private, no-store, max-age=0
      - path: /survey/*
        name: Cache-Control
        value: private, no-store, max-age=0
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
